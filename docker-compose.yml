# Local deployment: `docker compose up -d --build --wait`, then open http://localhost:8501 (review UI)
# or http://localhost:8000 (API)
# Credentials below are local-development defaults only; override via .env for
# anything reachable by others.
x-app-env: &app-env
  WILDINBOX_DATABASE_URL: postgresql+psycopg://wildinbox:${POSTGRES_PASSWORD:-wildinbox}@postgres:5432/wildinbox
  WILDINBOX_REDIS_URL: redis://redis:6379/0
  WILDINBOX_OBJECT_STORE_BACKEND: s3
  WILDINBOX_OBJECT_STORE_URL: http://objects:9000
  WILDINBOX_OBJECT_STORE_BUCKET: wildinbox
  WILDINBOX_OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-wildinbox}
  WILDINBOX_OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-wildinbox-local-only}
  WILDINBOX_DISPATCH: rq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wildinbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wildinbox}
      POSTGRES_DB: wildinbox
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wildinbox"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # S3-compatible object storage. SeaweedFS replaces MinIO, which stopped
  # publishing public container images (Docker Hub in 2025, quay.io in 2026).
  objects:
    image: chrislusf/seaweedfs:4.47
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json"]
    configs:
      - source: s3_identities
        target: /etc/seaweedfs/s3.json
    volumes: [objects:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/status || exit 1"]
      interval: 2s
      retries: 60

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres: {condition: service_healthy}

  api:
    build: .
    restart: unless-stopped
    environment: *app-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      objects: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      retries: 40

  worker:
    build: .
    command: ["wildinbox", "worker"]
    restart: unless-stopped   # a crashed or killed worker comes back; its job is recovered
    environment: *app-env
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      objects: {condition: service_healthy}

  ui:
    build: .
    command: ["wildinbox", "ui", "--host", "0.0.0.0", "--port", "8501", "--api-url", "http://api:8000"]
    restart: unless-stopped
    ports: ["127.0.0.1:8501:8501"]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 3s
      retries: 40

volumes:
  postgres:
  objects:

configs:
  s3_identities:
    content: |
      {"identities": [{"name": "wildinbox",
        "credentials": [{"accessKey": "${OBJECT_STORE_ACCESS_KEY:-wildinbox}",
                         "secretKey": "${OBJECT_STORE_SECRET_KEY:-wildinbox-local-only}"}],
        "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
