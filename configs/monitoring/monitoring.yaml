# Monitoring thresholds (GET /monitoring, GET /metrics, the UI's Monitoring page).
# An alert is raised when a value crosses its limit.

operations:
  window_days: 7                     # processing-time window for rates and throughput
  max_queue_age_seconds: 900         # oldest job waiting to run
  max_stale_leases: 0                # running jobs whose worker stopped renewing its lease
  max_failed_jobs: 0                 # terminal failures in the window
  max_processing_error_rate: 0.02    # failed frames / images scored
  max_unreadable_rate: 0.05          # undecodable or unsupported files / files uploaded
  restart_window_hours: 24           # window for worker starts and deaths
  max_worker_deaths: 0               # workers that stopped reporting without shutting down
  max_worker_starts: 6               # more starts than this suggests a crash loop
  max_worker_rss_mb: 3072            # resident memory of one worker process
  max_api_server_error_rate: 0.01    # 5xx responses / responses since the API started
  max_api_p95_ms: 500                # metadata GET routes with enough requests (target)
  min_api_requests: 20
  max_storage_gb: 200                # stored originals

# Signals that need NO labels, per camera: the camera's most recent events
# (by capture time) against its earlier events. They can flag that something
# changed; they cannot say whether accuracy changed.
drift:
  recent_events: 100
  min_events: 50                     # both windows need at least this many events
  max_label_psi: 0.25                # population stability index, suggested labels
  max_confidence_psi: 0.25           # PSI of event confidence (calibrated)
  max_uncertainty_change: 0.10       # absolute change in the share of low-confidence events
  max_night_share_change: 0.20       # absolute change in the share of night frames
  max_blur_change: 0.50              # relative change in median sharpness

# Accuracy measured from human reviews only. Unreviewed events have unknown accuracy.
accuracy:
  min_reviewed: 30                   # below this, no rate is reported for a camera
  max_correction_rate: 0.50          # alert when the 95% lower bound exceeds this

# Model behavior (no labels needed): what the model decided for each camera's
# latest batch against its earlier batches, and for the recent period against
# the one before it (globally, with the camera-mix effect separated).
behavior:
  min_events: 50                     # earlier events needed to compare against
  min_batch_events: 20               # a latest batch smaller than this is not compared
  period_days: 7
  max_label_psi: 0.25
  max_confidence_psi: 0.25
  max_share_change: 0.15             # filtered / auto-labeled / to-review / unfamiliar share
  max_mean_confidence_change: 0.10
  max_night_share_change: 0.20
  max_blur_change: 0.50

# Errors of automatic decisions, from the random audit sample only.
audits:
  max_false_empty_rate: 0.02         # alert when the 95% lower bound exceeds this
  max_species_error_rate: 0.05       # 95% precision target for accepted species labels
