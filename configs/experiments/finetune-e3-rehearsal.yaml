# Rehearsal candidate (2026-09-27): cycle 1 re-run on current code. The deployed E3 recipe,
# unchanged, plus the rebuilt cycle-1 snapshot. Current code crops at the corrected aspect
# ratio (PR #47), so this is a new experiment, not a reproduction of finetune-e3-update1.
# (configs/experiments/update_cycle.yaml; snapshot built by `wildinbox snapshot build`)
# Train:    uv run wildinbox finetune train --config configs/experiments/finetune-e3-rehearsal.yaml
# Evaluate: uv run wildinbox evaluate --model models/finetune-e3-rehearsal --report-dir reports/update/finetune-e3-rehearsal
name: finetune-e3-rehearsal
description: "Rehearsal: E3 recipe + rebuilt cycle-1 snapshot (cameras 90, 125, before cutoff)"
run_config: configs/example.yaml
splits: configs/splits/cct20.yaml
weights: IMAGENET1K_V1              # torchvision ImageNet-1k; not wildlife-specific
trainable_from_block: 3        # blocks below are frozen (BN statistics kept)
imbalance: balanced_sampling
augmentation:
  crop_scale: [0.35, 1.0]           # area fraction; crops that cut >10% of any box are rejected
  unboxed_crop_scale: [0.8, 1.0]    # animals without boxes: mild crops only
  min_box_kept: 0.9
  photometric: false
optim:
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 3
  batch_size: 32
  warmup_steps: 200
device: mps
num_workers: 2
cache_short_side: 320               # training-input cache for loading speed; eval uses originals
snapshot: data/snapshots/update1-de9679c534af
