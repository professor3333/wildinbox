# The unit of evidence is the capture EVENT (frames are aggregated by the
# policy and never counted as independent). Events from one camera on one night
# share lighting, background, and often the same animal, so intervals resample
# clusters, not events.
definitions:
  animal_events: "roles supported_species + unsupported_animal + mixed_species (cars are neither animal nor empty)"
  eligible_events: "every final-test event (8,982): each could be handled automatically"
  animal_event_retention: "animal events NOT disposed likely_empty / animal events"
  accepted_species_precision: "species_identified events whose true label is that species / species_identified events; undefined when there are none"
  automatic_coverage: "events disposed likely_empty or species_identified / eligible events"
  review_reduction: "1 - (events needing review + automatic events selected for audit) / events after grouping; the grouped manual baseline reviews every event once"
  unsupported_false_acceptance: "unsupported_animal events disposed species_identified / unsupported_animal events"
  retention_groups: [all_animals, supported_species, unsupported_animal, mixed_species]

policies:
  released: "the deployed policy (automation off)"
  rule: "the rule's operating point from development data (empty filter 0.65), evaluated as the automation that WOULD run; not released"

targets:
  animal_event_retention: 0.98
  accepted_species_precision: 0.95
  review_reduction: 0.50
# A target is "met" when the point estimate reaches it and "met with
# confidence" when the lower bound of the primary interval does. An undefined
# metric (zero denominator) is reported as undefined, never as 0% or 100%.

uncertainty:
  primary: "cluster bootstrap over camera-nights (camera x night; a night runs noon to noon in capture time)"
  sensitivity: "cluster bootstrap over the 9 cameras; with 9 clusters this interval is coarse and is shown to make that visible"
  naive: "Wilson 95% on events as if independent, shown only for comparison"
  resamples: 2000
  seed: 20260925
  level: 0.95
per_camera: "every metric for each of the 9 cameras, with min / median / max"

# Error gallery: final-test mistakes shown to explain failure modes. Selected
# by a fixed rule (sha256 of the event id, ascending), never by eye, and used
# for documentation only: nothing is tuned from it.
gallery:
  frame: "the event's frame with the highest calibrated probability for the predicted class"
  thumbnail_px: 320
  categories:
    - {name: animal_filtered_as_empty, rule: "animal event disposed likely_empty under the rule's operating point", count: 8}
    - {name: confident_wrong_species, rule: "supported-species event whose suggested species is wrong with confidence >= 0.9", count: 8}
    - {name: unsupported_as_known, rule: "unsupported-species event suggested as a supported species with confidence >= 0.9", count: 6}
    - {name: animal_suggested_empty_night, rule: "animal event at night whose suggestion is empty (needs review under the released policy)", count: 6}
