# v2 adaptation, per-camera fine-tuning (docs/v2_experiment.md): the deployed E3
# recipe unchanged, plus development camera 137's first 50 reviewed events.
# Train: uv run wildinbox finetune train --config configs/experiments/adaptation/finetune-e3-cam137-n50.yaml
name: finetune-e3-adapt-cam137-n50
description: "E3 recipe + development camera 137, first 50 reviewed events"
run_config: configs/example.yaml
splits: configs/splits/cct20.yaml
weights: IMAGENET1K_V1
trainable_from_block: 3
imbalance: balanced_sampling
augmentation:
  crop_scale: [0.35, 1.0]
  unboxed_crop_scale: [0.8, 1.0]
  min_box_kept: 0.9
  photometric: false
optim:
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 3
  batch_size: 32
  warmup_steps: 200
device: mps
num_workers: 2
cache_short_side: 320
adaptation:
  split: cct-fresh-dev-v1
  images: cct_fresh_dev
  camera: "137"
  reviewed_events: 50
