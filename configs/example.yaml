# Example run configuration. Validate with: uv run wildinbox validate-config configs/example.yaml
#
# PLACEHOLDER: thresholds are chosen later on the policy-validation partition;
# automation stays disabled until evaluation supports an operating point.

config_version: 1
seed: 20260924

dataset:
  name: cct20
  manifest_version: cct20-396eb43cc6ce  # pinned in manifests/cct20.lock.json

model:
  architecture: efficientnet_b0
  pretrained_weights: IMAGENET1K_V1

# Matches torchvision EfficientNet_B0_Weights.IMAGENET1K_V1 eval transforms.
preprocessing:
  resize_size: 256
  crop_size: 224
  interpolation: bicubic
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

# Model output order: `supported_classes` from manifests/cct20-splits-v1.lock.json,
# chosen by the species-selection rule in configs/splits/cct20.yaml.
# Changing order changes the class-map fingerprint.
classes:
  - empty
  - bobcat
  - cat
  - coyote
  - dog
  - opossum
  - rabbit
  - raccoon

policy_version: policy-v0

thresholds:
  empty_filter: 0.99
  species_accept: 0.95
  unfamiliar_max_distance: null
  auto_filter_enabled: false
  auto_accept_enabled: false
